services:
  # ===== PostgreSQL =====
  postgres:
    image: postgres:16
    container_name: py01_postgres
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ===== MongoDB Config Servers (Replica Set: configrs0) =====
  config-server-1:
    image: mongo:8
    container_name: py01_configsvr1
    restart: unless-stopped
    command: ["mongod", "--configsvr", "--replSet", "configrs0", "--port", "27019", "--bind_ip_all"]
    volumes:
      - configsvr1_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27019", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  config-server-2:
    image: mongo:8
    container_name: py01_configsvr2
    restart: unless-stopped
    command: ["mongod", "--configsvr", "--replSet", "configrs0", "--port", "27020", "--bind_ip_all"]
    volumes:
      - configsvr2_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27020", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  config-server-3:
    image: mongo:8
    container_name: py01_configsvr3
    restart: unless-stopped
    command: ["mongod", "--configsvr", "--replSet", "configrs0", "--port", "27021", "--bind_ip_all"]
    volumes:
      - configsvr3_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27021", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Init config server replica set
  configsvr-setup:
    image: mongo:8
    container_name: py01_configsvr_setup
    restart: "no"
    depends_on:
      config-server-1:
        condition: service_healthy
      config-server-2:
        condition: service_healthy
      config-server-3:
        condition: service_healthy
    volumes:
      - ./infra/mongo/init-configsvr.sh:/scripts/init-configsvr.sh:ro
    entrypoint: ["bash", "/scripts/init-configsvr.sh"]

  # ===== MongoDB Shard 1 (Replica Set: shard1rs0) =====
  shard1-node1:
    image: mongo:8
    container_name: py01_shard1_node1
    restart: unless-stopped
    command: ["mongod", "--shardsvr", "--replSet", "shard1rs0", "--port", "27017", "--bind_ip_all"]
    volumes:
      - shard1_node1_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  shard1-node2:
    image: mongo:8
    container_name: py01_shard1_node2
    restart: unless-stopped
    command: ["mongod", "--shardsvr", "--replSet", "shard1rs0", "--port", "27018", "--bind_ip_all"]
    volumes:
      - shard1_node2_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27018", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  shard1-node3:
    image: mongo:8
    container_name: py01_shard1_node3
    restart: unless-stopped
    command: ["mongod", "--shardsvr", "--replSet", "shard1rs0", "--port", "27022", "--bind_ip_all"]
    volumes:
      - shard1_node3_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27022", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ===== MongoDB Shard 2 (Replica Set: shard2rs0) =====
  shard2-node1:
    image: mongo:8
    container_name: py01_shard2_node1
    restart: unless-stopped
    command: ["mongod", "--shardsvr", "--replSet", "shard2rs0", "--port", "27023", "--bind_ip_all"]
    volumes:
      - shard2_node1_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27023", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  shard2-node2:
    image: mongo:8
    container_name: py01_shard2_node2
    restart: unless-stopped
    command: ["mongod", "--shardsvr", "--replSet", "shard2rs0", "--port", "27024", "--bind_ip_all"]
    volumes:
      - shard2_node2_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27024", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  shard2-node3:
    image: mongo:8
    container_name: py01_shard2_node3
    restart: unless-stopped
    command: ["mongod", "--shardsvr", "--replSet", "shard2rs0", "--port", "27025", "--bind_ip_all"]
    volumes:
      - shard2_node3_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27025", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Init shard replica sets
  shards-setup:
    image: mongo:8
    container_name: py01_shards_setup
    restart: "no"
    depends_on:
      shard1-node1:
        condition: service_healthy
      shard1-node2:
        condition: service_healthy
      shard1-node3:
        condition: service_healthy
      shard2-node1:
        condition: service_healthy
      shard2-node2:
        condition: service_healthy
      shard2-node3:
        condition: service_healthy
    volumes:
      - ./infra/mongo/init-shards.sh:/scripts/init-shards.sh:ro
    entrypoint: ["bash", "/scripts/init-shards.sh"]

  # ===== Mongos Router =====
  mongos:
    image: mongo:8
    container_name: py01_mongos
    restart: unless-stopped
    command: ["mongos", "--configdb", "configrs0/config-server-1:27019,config-server-2:27020,config-server-3:27021", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    depends_on:
      configsvr-setup:
        condition: service_completed_successfully
      shards-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "mongosh", "--host", "localhost:27017", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s

  # Configure sharding (add shards + shard collections)
  sharding-setup:
    image: mongo:8
    container_name: py01_sharding_setup
    restart: "no"
    depends_on:
      mongos:
        condition: service_healthy
    volumes:
      - ./infra/mongo/init-sharding.sh:/scripts/init-sharding.sh:ro
    entrypoint: ["bash", "/scripts/init-sharding.sh"]

  # ===== Redis =====
  redis:
    image: redis:7
    container_name: py01_redis
    restart: unless-stopped
    mem_limit: 256m
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ===== Elasticsearch =====
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.5
    container_name: py01_elasticsearch
    restart: unless-stopped
    mem_limit: 1g
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 300s

  # ===== API Service =====
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      sharding-setup:
        condition: service_completed_successfully
    ports:
      - "3000"
    environment:
      - NODE_ENV=production
      - DB_ENGINE=${DB_ENGINE:-postgres}

  # ===== Search Service =====
  search:
    build:
      context: .
      dockerfile: services/search/Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    env_file:
      - .env
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000"
    environment:
      - NODE_ENV=production
      - DB_ENGINE=${DB_ENGINE:-postgres}
      - MONGO_URI=${MONGO_URI}

  # ===== Nginx Gateway =====
  nginx:
    image: nginx:1.27
    container_name: py01_nginx
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      - api
      - search
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  # ===== Hive Metastore Database =====
  hive-metastore-db:
    image: postgres:16-alpine
    container_name: py01_hive_metastore_db
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_DB: metastore_db
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
    volumes:
      - hive_metastore_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===== Hive Schema Init (one-shot, patches SQL bug in Hive 4.0.0) =====
  hive-schema-init:
    image: apache/hive:4.0.0
    container_name: py01_hive_schema_init
    restart: "no"
    depends_on:
      hive-metastore-db:
        condition: service_healthy
    environment:
      DB_DRIVER: postgres
      POSTGRES_HOST: hive-metastore-db
      POSTGRES_DATABASE: metastore_db
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
    entrypoint: ["/bin/bash", "-c"]
    command: |
      set -e
      echo "=== Hive Schema Init ==="
      sed -i '/statement_timeout/d' /opt/hive/scripts/schema/hive-schema-4.0.0.postgres.sql 2>/dev/null || true
      sed -i '/statement_timeout/d' /opt/hive/scripts/schema/hive-upgrade-postgres.sql 2>/dev/null || true
      if /opt/hive/bin/schematool -dbType postgres -info 2>&1 | grep -qi "schema version"; then
        echo "Schema already initialized, running upgrade..."
        /opt/hive/bin/schematool -dbType postgres -upgradeSchema || true
      else
        echo "Initializing schema..."
        /opt/hive/bin/schematool -dbType postgres -initSchema
      fi
      echo "=== Schema init complete ==="

  # ===== Hive Metastore (Thrift interface on 9083) =====
  hive-metastore:
    image: apache/hive:4.0.0
    container_name: py01_hive_metastore
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      hive-schema-init:
        condition: service_completed_successfully
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      POSTGRES_HOST: hive-metastore-db
      POSTGRES_DATABASE: metastore_db
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
      SKIP_SCHEMA_INIT: "true"
    ports:
      - "9083:9083"
    healthcheck:
      disable: true

  # ===== HiveServer2 (JDBC on 10000, Web UI on 10002) =====
  hive-server:
    image: apache/hive:4.0.0
    container_name: py01_hive_server
    restart: unless-stopped
    mem_limit: 1g
    depends_on:
      hive-metastore:
        condition: service_started
    environment:
      SERVICE_NAME: hiveserver2
      DB_DRIVER: postgres
      POSTGRES_HOST: hive-metastore-db
      POSTGRES_DATABASE: metastore_db
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
      HIVE_METASTORE_HOST: hive-metastore
    ports:
      - "10000:10000"
      - "10002:10002"
    volumes:
      - ./analytics/warehouse:/warehouse
    healthcheck:
      disable: true

  # ===== Spark Master =====
  spark-master:
    image: spark:3.5.8-python3
    container_name: py01_spark_master
    restart: unless-stopped
    mem_limit: 1g
    user: root
    ports:
      - "7077:7077"
      - "8081:8080"        # Spark Master Web UI (8081 host → 8080 container, 8080 es de Airflow)
    volumes:
      - ./analytics/spark:/opt/spark/analytics
      - ./analytics/reports:/opt/spark/reports
      - ./analytics/warehouse:/opt/spark/warehouse
    command:
      - bash
      - -c
      - |
        /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master \
        --host spark-master \
        --port 7077 \
        --webui-port 8080

  # ===== Spark Worker =====
  spark-worker:
    image: spark:3.5.8-python3
    container_name: py01_spark_worker
    restart: unless-stopped
    mem_limit: 2g
    user: root
    depends_on:
      - spark-master
    environment:
      SPARK_WORKER_CORES: 1
      SPARK_WORKER_MEMORY: 1g
    volumes:
      - ./analytics/spark:/opt/spark/analytics
      - ./analytics/reports:/opt/spark/reports
      - ./analytics/warehouse:/opt/spark/warehouse
    command:
      - bash
      - -c
      - |
        /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker \
        spark://spark-master:7077

  # ===== Superset (BI para análisis del Data Warehouse) =====
  superset:
    image: apache/superset:4.1.1
    container_name: py01_superset
    restart: unless-stopped
    mem_limit: 1g
    depends_on:
      hive-server:
        condition: service_started
    environment:
      SUPERSET_SECRET_KEY: change_me_superset_123
      SUPERSET_CONFIG_PATH: /app/superset_config.py
      PYTHONPATH: /app
    ports:
      - "8088:8088"        # Superset Web UI
    volumes:
      - ./analytics/superset/superset_config.py:/app/superset_config.py
      - ./analytics/superset/init_superset.py:/app/init_superset.py
      - ./analytics/superset/export_reports.py:/app/export_reports.py
      - ./analytics/reports:/app/reports
      - superset_data:/var/lib/superset
    command:
      - bash
      - -c
      - |
        mkdir -p /var/lib/superset
        pip install pyhive thrift thrift-sasl --quiet 2>/dev/null
        superset fab create-admin --username admin --firstname Admin --lastname User --email admin@example.com --password admin 2>/dev/null; true
        superset db upgrade
        superset init 2>/dev/null; true
        echo '=== Superset listo en http://localhost:8088 (admin/admin) ==='
        superset run -p 8088 --host 0.0.0.0 --with-threads

  # ===== Airflow =====
  airflow:
    image: apache/airflow:3.2.2
    container_name: py01_airflow
    restart: unless-stopped
    mem_limit: 1g
    depends_on:
      - spark-master
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=False
      - AIRFLOW__WEBSERVER__RBAC=True
      - AIRFLOW_ADMIN_USER=admin
      - AIRFLOW_ADMIN_PASSWORD=admin
      - AIRFLOW__CORE__FERNET_KEY=
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
    ports:
      - "8080:8080"        # Airflow Web UI
    volumes:
      - ./analytics/airflow/dag:/opt/airflow/dags
      - ./analytics/spark:/opt/airflow/spark
      - ./analytics/superset:/opt/airflow/superset
      - ./analytics/reports:/opt/airflow/reports
      - airflow_data:/opt/airflow
    command: >
      bash -c "
        pip install 'pyspark==3.5.8' 'pyhive[hive]' thrift thrift-sasl --quiet 2>/dev/null &&
        airflow db init &&
        airflow users create
          --username admin
          --firstname Admin
          --lastname User
          --role Admin
          --email admin@example.com
          --password admin 2>/dev/null || true &&
        airflow webserver & sleep 5 &&
        airflow scheduler
      "

volumes:
  postgres_data:
  configsvr1_data:
  configsvr2_data:
  configsvr3_data:
  shard1_node1_data:
  shard1_node2_data:
  shard1_node3_data:
  shard2_node1_data:
  shard2_node2_data:
  shard2_node3_data:
  es_data:
  hive_metastore_data:
  airflow_data:
  superset_data:
